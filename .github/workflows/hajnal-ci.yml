name: Hajnal S0
on:
  push:
    branches: [build/starter]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hajnal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash scripts/ci_verify.sh
  build-human:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/starter'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build signed HUMAN APK
        env:
          HAJNAL_KEYSTORE_BASE64: ${{ secrets.HAJNAL_KEYSTORE_BASE64 }}
          HAJNAL_KEYSTORE_PASSWORD: ${{ secrets.HAJNAL_KEYSTORE_PASSWORD }}
          HAJNAL_KEY_ALIAS: ${{ secrets.HAJNAL_KEY_ALIAS }}
          HAJNAL_BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$HAJNAL_KEYSTORE_BASE64" && test -n "$HAJNAL_KEYSTORE_PASSWORD" && test -n "$HAJNAL_KEY_ALIAS"
          umask 077
          printf '%s' "$HAJNAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajnal.jks"
          export HAJNAL_KEYSTORE_PATH="$RUNNER_TEMP/hajnal.jks"
          flutter build apk --profile --target lib/main.dart --build-number "$GITHUB_RUN_NUMBER"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/hajnal-build-time"
          tools_dir="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools_dir/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-profile.apk > "$RUNNER_TEMP/hajnal-signature.txt"
          python3 scripts/signing_certificate.py "$RUNNER_TEMP/hajnal-signature.txt" scripts/hajnal_signer.sha256
          rm -f "$RUNNER_TEMP/hajnal.jks"
      - name: Create candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Hajnal S0 ${GITHUB_SHA:0:12}" --notes "Candidate for commit $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true
          target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
          tag_sha="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '/\^\{\}$/{peeled=$1} !/\^\{\}$/{tag=$1} END {print peeled ? peeled : tag}')"
          if [ -n "$tag_sha" ]; then test "$tag_sha" = "$GITHUB_SHA"; else test "$target" = "$GITHUB_SHA"; fi
      - name: Reuse immutable APK on a repeated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reuse_human.sh
      - name: Stage signed HUMAN candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage_human.sh
  human-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/starter'
    needs: [verify, build-human]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free space on the ephemeral runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/share/chromium /opt/google/chrome \
            /opt/microsoft/msedge /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run local and schema checks in the release workspace
        run: bash scripts/ci_verify.sh
      - name: Capture HTML reference
        run: |
          mkdir -p evidence
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8768 --directory html-prototypes > /tmp/hajnal-http.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null
          node scripts/capture_html_reference.cjs
          test -s evidence/html-closed.png && test -s evidence/html-open.png
      - run: flutter build apk --debug
      - name: Compile native smoke tests
        run: cd android && ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signed HUMAN candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HAJNAL_KEYSTORE_BASE64: ${{ secrets.HAJNAL_KEYSTORE_BASE64 }}
          HAJNAL_KEYSTORE_PASSWORD: ${{ secrets.HAJNAL_KEYSTORE_PASSWORD }}
          HAJNAL_KEY_ALIAS: ${{ secrets.HAJNAL_KEY_ALIAS }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          apk="hajnal_S0_HUMAN_${GITHUB_SHA:0:12}.apk"
          mkdir -p candidate
          gh release download "$tag" --pattern "$apk" --pattern candidate.json --dir candidate
          python3 scripts/record_validation.py candidate/candidate.json "candidate/$apk" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/null
          cp "candidate/$apk" build/app/outputs/flutter-apk/app-profile.apk
          python3 -c 'import json; print(json.load(open("candidate/candidate.json"))["buildTime"])' > "$RUNNER_TEMP/hajnal-build-time"
          test -n "$HAJNAL_KEYSTORE_BASE64" && test -n "$HAJNAL_KEYSTORE_PASSWORD" && test -n "$HAJNAL_KEY_ALIAS"
          umask 077
          printf '%s' "$HAJNAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajnal.jks"
          export HAJNAL_KEYSTORE_PATH="$RUNNER_TEMP/hajnal.jks"
          test_apk="$(find build/app/outputs/apk/androidTest -name '*.apk' -print -quit)"
          test -n "$test_apk"
          tools_dir="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools_dir/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-profile.apk > "$RUNNER_TEMP/hajnal-signature.txt"
          python3 scripts/signing_certificate.py "$RUNNER_TEMP/hajnal-signature.txt" scripts/hajnal_signer.sha256
          "$tools_dir/apksigner" sign --ks "$HAJNAL_KEYSTORE_PATH" --ks-key-alias "$HAJNAL_KEY_ALIAS" \
            --ks-pass env:HAJNAL_KEYSTORE_PASSWORD --key-pass env:HAJNAL_KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/hajnal-signed-test.apk" "$test_apk"
          rm -f "$RUNNER_TEMP/hajnal.jks"
      - name: Get previous published HUMAN APK for upgrade test
        run: bash scripts/previous_human.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hajnal-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /
      - name: Android smoke and integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash scripts/android_smoke.sh
      - name: Record runner resource and kernel diagnostics
        if: failure()
        run: |
          mkdir -p evidence
          {
            free -m
            df -h /
            for file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$file" ]; then printf '\n%s\n' "$file"; cat "$file"; fi
            done
          } > evidence/runner-resources.txt
          sudo dmesg | tail -n 3000 | grep -Ei 'out of memory|killed process|oom-kill|qemu|segfault' > evidence/runner-kernel.txt || true
      - name: Preserve failed run evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_failed_evidence.sh
      - name: Compare app lock screenshots with the source reference
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 scripts/compare_lock_screens.py
          python3 scripts/launcher_mask_evidence.py
      - name: Publish evidence to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_evidence.sh
      - name: Require rendered lock screen evidence
        run: |
          grep -qx PASS evidence/lock-logo-status.txt
          grep -qx PASS evidence/lock-settings-status.txt
      - name: Record successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          python3 scripts/record_validation.py candidate/candidate.json build/app/outputs/flutter-apk/app-profile.apk "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > candidate/validation.json
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq validation.json; then
            mkdir -p candidate/existing
            gh release download "$tag" --pattern validation.json --dir candidate/existing
            python3 -c 'import json; a=json.load(open("candidate/validation.json")); b=json.load(open("candidate/existing/validation.json")); assert all(a[k] == b[k] for k in ("commit", "run", "sha256")) and int(b["attempt"]) > 0'
          else
            gh release upload "$tag" candidate/validation.json
          fi
  publish-reviewed:
    needs: [verify, build-human, human-apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wait for visual review of this candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 90); do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq visual-review.json; then exit 0; fi
            sleep 10
          done
          echo 'Visual review was not supplied within 15 minutes.' >&2
          exit 1
      - name: Verify the reviewed candidate and its original test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin build/starter
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          apk="hajnal_S0_HUMAN_${GITHUB_SHA:0:12}.apk"
          mkdir -p reviewed
          gh release download "$tag" --pattern "$apk" --pattern 'candidate.json' --pattern 'validation.json' --pattern 'visual-review.json' --pattern 'html-*.png' --pattern 'onboarding.png' --pattern 'boarding-*.png' --pattern 'dashboard-*.png' --pattern 'picker-*.png' --pattern 'lock-*.png' --pattern 'calendar-*.png' --pattern 'style-*.png' --pattern 'launcher-mask-*.png' --pattern 'practice-*.png' --dir reviewed
          source_attempt="$(python3 -c 'import json; print(json.load(open("reviewed/validation.json"))["attempt"])')"
          [[ "$source_attempt" =~ ^[0-9]+$ ]]
          gh run view "$GITHUB_RUN_ID" --attempt "$source_attempt" --json headSha,headBranch,event,status,conclusion,jobs > reviewed/run.json
          python3 scripts/verify_release_candidate.py reviewed/run.json reviewed/candidate.json reviewed/validation.json "reviewed/$apk" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          python3 scripts/check_visual_review.py reviewed "$GITHUB_SHA"
          python3 scripts/check_s0_acceptance.py
          python3 -c 'import json; print(json.load(open("reviewed/candidate.json"))["buildTime"])' > "$RUNNER_TEMP/hajnal-build-time"
      - name: Publish the same tested APK and update Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_human.sh
