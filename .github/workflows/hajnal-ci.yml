name: Hajnal S0
on:
  push:
    branches: [build/starter]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hajnal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash scripts/ci_verify.sh
  human-apk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/build/starter'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free space on the ephemeral runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/share/chromium /opt/google/chrome \
            /opt/microsoft/msedge /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run local and schema checks in the release workspace
        run: bash scripts/ci_verify.sh
      - name: Capture HTML reference
        run: |
          mkdir -p evidence
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8768 --directory html-prototypes > /tmp/hajnal-http.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null
          node scripts/capture_html_reference.cjs
          test -s evidence/html-closed.png && test -s evidence/html-open.png
      - run: flutter build apk --debug
      - name: Compile native smoke tests
        run: cd android && ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Build signed HUMAN APK
        env:
          HAJNAL_KEYSTORE_BASE64: ${{ secrets.HAJNAL_KEYSTORE_BASE64 }}
          HAJNAL_KEYSTORE_PASSWORD: ${{ secrets.HAJNAL_KEYSTORE_PASSWORD }}
          HAJNAL_KEY_ALIAS: ${{ secrets.HAJNAL_KEY_ALIAS }}
          HAJNAL_BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$HAJNAL_KEYSTORE_BASE64" && test -n "$HAJNAL_KEYSTORE_PASSWORD" && test -n "$HAJNAL_KEY_ALIAS"
          umask 077
          printf '%s' "$HAJNAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajnal.jks"
          export HAJNAL_KEYSTORE_PATH="$RUNNER_TEMP/hajnal.jks"
          flutter build apk --profile --target lib/main.dart --build-number "$GITHUB_RUN_NUMBER"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/hajnal-build-time"
          test_apk="$(find build/app/outputs/apk/androidTest -name '*.apk' -print -quit)"
          test -n "$test_apk"
          tools_dir="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools_dir/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-profile.apk > "$RUNNER_TEMP/hajnal-signature.txt"
          python3 scripts/signing_certificate.py "$RUNNER_TEMP/hajnal-signature.txt" scripts/hajnal_signer.sha256
          "$tools_dir/apksigner" sign --ks "$HAJNAL_KEYSTORE_PATH" --ks-key-alias "$HAJNAL_KEY_ALIAS" \
            --ks-pass env:HAJNAL_KEYSTORE_PASSWORD --key-pass env:HAJNAL_KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/hajnal-signed-test.apk" "$test_apk"
          rm -f "$RUNNER_TEMP/hajnal.jks"
      - name: Get previous published HUMAN APK for upgrade test
        run: bash scripts/previous_human.sh
      - name: Reuse immutable APK on a repeated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reuse_human.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hajnal-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /
      - name: Android smoke and integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash scripts/android_smoke.sh
      - name: Compare app lock screenshots with the source reference
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 scripts/compare_lock_screens.py
      - name: Publish evidence to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_evidence.sh
      - name: Require rendered lock screen evidence
        run: |
          grep -qx PASS evidence/lock-logo-status.txt
          grep -qx PASS evidence/lock-settings-status.txt
      - name: Verify manual comparison of this commit's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          mkdir -p reviewed
          gh release download "$tag" --pattern 'visual-review.json' --pattern 'html-*.png' --pattern 'onboarding.png' --pattern 'dashboard-*.png' --pattern 'picker-*.png' --pattern 'lock-*.png' --dir reviewed
          python3 scripts/check_visual_review.py reviewed "$GITHUB_SHA"
      - name: Require reviewed S0 acceptance criteria
        run: |
          python3 - <<'PYGATE'
          from pathlib import Path
          text = Path('docs/implementation/S0_ACCEPTANCE.md').read_text()
          # Other criteria are gated by this exact commit's tests and visual review;
          # requiring their prior DONE text would create a circular SHA dependency.
          required = ['S0-01', 'S0-06', 'S0-07', 'S0-08', 'S0-15']
          incomplete = [key for key in required if not any(line.startswith('| ' + key + ' |') and '| DONE ' in line for line in text.splitlines())]
          if incomplete:
              raise SystemExit('Incomplete S0 acceptance criteria: ' + ', '.join(incomplete))
          PYGATE
      - name: Publish release, verify public download and update Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_human.sh
