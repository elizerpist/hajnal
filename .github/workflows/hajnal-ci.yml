name: Hajnal S0
on:
  push:
    branches: [build/starter]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hajnal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    outputs:
      logs_upload: ${{ steps.verify_artifact.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test scripts/calendar_dst_check.dart
      - run: flutter analyze --no-pub
      - run: TZ=Europe/Budapest dart run scripts/calendar_dst_check.dart
      - run: flutter test --no-pub --reporter expanded | tee flutter-test.log
        shell: bash
      - run: dart run build_runner build && git diff --exit-code -- lib/core/database/hajnal_database.g.dart
      - run: |
          mkdir -p /tmp/hajnal-schema
          dart run drift_dev schema dump lib/core/database/hajnal_database.dart /tmp/hajnal-schema/
          diff -u drift_schemas/drift_schema_v1.json /tmp/hajnal-schema/drift_schema_v1.json
      # Keep test failures fatal; the job log remains available if artifact storage is full.
      - uses: actions/upload-artifact@v4
        id: verify_artifact
        if: always()
        continue-on-error: true
        with:
          name: verify-logs-${{ github.sha }}
          path: flutter-test.log
          if-no-files-found: ignore
  android-smoke:
    outputs:
      evidence_upload: ${{ steps.android_artifact.outcome }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free space on the ephemeral runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/share/chromium /opt/google/chrome \
            /opt/microsoft/msedge /usr/local/.ghcup
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Compile native smoke tests
        run: cd android && ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Reserve disk for the emulator
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hajnal-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        id: android_artifact
        if: always()
        continue-on-error: true
        with:
          name: android-evidence-${{ github.sha }}
          path: |
            evidence/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
      # Preserve inspectable synthetic screenshots even if artifact storage is full.
      - name: Log Android screenshots if artifact upload fails
        if: always() && steps.android_artifact.outcome == 'failure'
        run: python3 scripts/log_screenshots.py evidence/onboarding.png evidence/dashboard-closed.png evidence/dashboard-open.png
  reference-screens:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture HTML reference
        run: |
          mkdir -p evidence
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8768 --directory html-prototypes > /tmp/hajnal-http.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8768/app-shell/ >/dev/null
          node scripts/capture_html_reference.cjs
      - uses: actions/upload-artifact@v4
        id: reference_artifact
        if: always()
        with:
          name: html-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Log reference screenshots if artifact upload fails
        if: always() && steps.reference_artifact.outcome == 'failure'
        run: python3 scripts/log_screenshots.py evidence/html-closed.png evidence/html-open.png
  profile-build-check:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/build/starter'
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check signed profile build without publishing
        env:
          HAJNAL_KEYSTORE_BASE64: ${{ secrets.HAJNAL_KEYSTORE_BASE64 }}
          HAJNAL_KEYSTORE_PASSWORD: ${{ secrets.HAJNAL_KEYSTORE_PASSWORD }}
          HAJNAL_KEY_ALIAS: ${{ secrets.HAJNAL_KEY_ALIAS }}
          HAJNAL_BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$HAJNAL_KEYSTORE_BASE64" && test -n "$HAJNAL_KEYSTORE_PASSWORD" && test -n "$HAJNAL_KEY_ALIAS"
          umask 077
          printf '%s' "$HAJNAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajnal.jks"
          export HAJNAL_KEYSTORE_PATH="$RUNNER_TEMP/hajnal.jks"
          flutter build apk --profile --target lib/main.dart
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-profile.apk
          sha256sum build/app/outputs/flutter-apk/app-profile.apk
  human-apk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/build/starter' && needs.verify.outputs.logs_upload == 'success' && needs.android-smoke.outputs.evidence_upload == 'success'
    needs: [verify, android-smoke, reference-screens]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Require completed S0 implementation criteria
        run: |
          python3 - <<'PYGATE'
          from pathlib import Path
          text = Path('docs/implementation/S0_ACCEPTANCE.md').read_text()
          required = [f'S0-{i:02d}' for i in range(1, 12)] + ['S0-15']
          incomplete = [key for key in required if not any(line.startswith('| ' + key + ' |') and '| DONE ' in line for line in text.splitlines())]
          if incomplete:
              raise SystemExit('Incomplete S0 acceptance criteria: ' + ', '.join(incomplete))
          PYGATE
      - name: Restore signing key
        env:
          HAJNAL_KEYSTORE_BASE64: ${{ secrets.HAJNAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$HAJNAL_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$HAJNAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajnal.jks"
      - name: Build and verify HUMAN APK
        env:
          HAJNAL_KEYSTORE_PATH: ${{ runner.temp }}/hajnal.jks
          HAJNAL_KEYSTORE_PASSWORD: ${{ secrets.HAJNAL_KEYSTORE_PASSWORD }}
          HAJNAL_KEY_ALIAS: ${{ secrets.HAJNAL_KEY_ALIAS }}
          HAJNAL_BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$HAJNAL_KEYSTORE_PASSWORD" && test -n "$HAJNAL_KEY_ALIAS"
          flutter build apk --profile --target lib/main.dart
          apk="hajnal_S0_HUMAN_${GITHUB_SHA:0:12}.apk"
          cp build/app/outputs/flutter-apk/app-profile.apk "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: HUMAN-${{ github.sha }}
          path: |
            hajnal_S0_HUMAN_*.apk
            hajnal_S0_HUMAN_*.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hajnal-s0-${GITHUB_SHA:0:12}"
          gh release create "$tag" hajnal_S0_HUMAN_*.apk hajnal_S0_HUMAN_*.sha256 --target "$GITHUB_SHA" --prerelease --title "Hajnal S0 ${GITHUB_SHA:0:12}" --notes "Human profile APK for commit $GITHUB_SHA."
